<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>FSP Schedule Filter</h1>
      <label class="toggle"><input type="checkbox" id="enabled" /> Enabled</label>
    </header>
    <p id="status" class="muted"></p>

    <section>
      <div class="section-head">
        <h2>Show only</h2>
      </div>
      <p class="muted small-top">Check rows to show just those. Nothing checked in a group shows the whole group.</p>
      <details class="picker" data-type="aircraft">
        <summary>Aircraft <span class="count"></span><button class="clear" type="button">Clear</button></summary>
        <ul class="checklist"></ul>
      </details>
      <details class="picker" data-type="instructor">
        <summary>Instructors <span class="count"></span><button class="clear" type="button">Clear</button></summary>
        <ul class="checklist"></ul>
      </details>
    </section>

    <section>
      <div class="section-head">
        <h2>Hide rows</h2>
        <button id="add-hide" type="button">+ Add</button>
      </div>
      <ul id="hide-list" class="rules"></ul>
    </section>

    <section>
      <div class="section-head">
        <h2>Highlight rows</h2>
        <button id="add-highlight" type="button">+ Add</button>
      </div>
      <ul id="highlight-list" class="rules"></ul>
    </section>

    <p class="muted small">Matches are case-insensitive "contains" on the row name, e.g. <code>N816</code> or <code>Kruger</code>.</p>

    <datalist id="names-aircraft"></datalist>
    <datalist id="names-instructor"></datalist>
    <datalist id="names-any"></datalist>

    <template id="rule-template">
      <li class="rule">
        <select class="type">
          <option value="aircraft">Aircraft</option>
          <option value="instructor">Instructor</option>
          <option value="any">Either</option>
        </select>
        <input class="text" type="text" placeholder="Text to match" />
        <input class="color" type="color" value="#ffd54f" />
        <button class="remove" type="button" title="Remove">✕</button>
      </li>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
